[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-standalone-memory"
version = "1.0.0"
authors = [
    { name = "SAGE Architecture Team" }
]
description = "Deterministic Multi-Tier Semantic Memory Subsystem for AI Agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.18"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0"
]
